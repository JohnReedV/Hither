[package]
name = "hither-sdf"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.7"
wgpu = { version = "29.0.4", default-features = false }

# Favor fast rebuilds, useful debugger output, and runtime checks during development.
[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
debug-assertions = false
overflow-checks = false

# Tests inherit dev settings, but should still catch invalid assumptions and overflow.
[profile.test]
debug-assertions = true
overflow-checks = true
